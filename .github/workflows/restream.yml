name: Restream Pipeline

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        type: choice
        options: [Twitch, YouTube, TikTok, Kick, Facebook]
      action:
        description: 'Action'
        required: true
        type: choice
        options: [start, stop]
      source_url:
        description: 'Source stream/video URL (YouTube, .m3u8, etc.)'
        required: false
        default: ''
      rtmp_url:
        description: 'RTMP URL (auto-filled for TikTok)'
        required: false
        default: ''
      stream_key:
        description: 'Stream key'
        required: false
        default: ''
      title:
        description: 'Stream title'
        required: false
        default: 'Live Stream'
      quality:
        description: 'Video quality preset'
        required: false
        type: choice
        options: [high, medium, low]
        default: 'high'

jobs:
  restream:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'start'
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install dependencies
        run: pip install streamlink

      - name: Resolve source URL
        id: resolve
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
        run: |
          if [ -n "$SOURCE_URL" ]; then
            # Check if it's a direct URL (m3u8, mp4, etc.)
            if echo "$SOURCE_URL" | grep -qE '\.(m3u8|mp4|flv|ts)'; then
              echo "stream_url=$SOURCE_URL" >> $GITHUB_OUTPUT
            else
              # Try to resolve with streamlink (better for live streams)
              STREAM_URL=$(streamlink --stream-url "$SOURCE_URL" best 2>/dev/null || echo "")
              if [ -n "$STREAM_URL" ]; then
                echo "stream_url=$STREAM_URL" >> $GITHUB_OUTPUT
              else
                echo "Error: Could not resolve source URL" >&2
                exit 1
              fi
            fi
          else
            echo "Error: source_url is required" >&2
            exit 1
          fi

      - name: Start restream
        env:
          PLATFORM: ${{ github.event.inputs.platform }}
          RTMP_URL: ${{ github.event.inputs.rtmp_url }}
          STREAM_KEY: ${{ github.event.inputs.stream_key }}
          STREAM_URL: ${{ steps.resolve.outputs.stream_url }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          # Build full RTMP URL
          FULL_RTMP="${RTMP_URL}${STREAM_KEY}"
          
          echo "Starting restream to $PLATFORM"
          echo "Source: $STREAM_URL"
          echo "RTMP: $FULL_RTMP"
          
          # Use streamlink to write to temp file, ffmpeg reads from it
          TMP_FILE="/tmp/stream_input_$$.ts"
          
          # Start streamlink in background writing to temp file with HLS live restart
          streamlink --output "$TMP_FILE" --hls-live-restart "$STREAM_URL" best &
          SL_PID=$!
          
          # Wait for streamlink to start writing (check file exists and has content)
          for i in {1..30}; do
            if [ -f "$TMP_FILE" ] && [ -s "$TMP_FILE" ]; then
              break
            fi
            sleep 1
          done
          
          if [ ! -f "$TMP_FILE" ] || [ ! -s "$TMP_FILE" ]; then
            echo "ERROR: streamlink failed to write to temp file"
            kill $SL_PID 2>/dev/null
            exit 1
          fi
          
          echo "Streamlink writing to $TMP_FILE, starting ffmpeg..."
          
          # Start FFmpeg reading from the growing temp file with robust flags
          ffmpeg -re \
            -fflags +genpts \
            -thread_queue_size 8192 \
            -i "$TMP_FILE" \
            -c:v copy \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv \
            -flvflags no_duration_filesize \
            "$FULL_RTMP"
          
          EXIT_CODE=$?
          
          # Cleanup
          kill $SL_PID 2>/dev/null
          wait $SL_PID 2>/dev/null
          rm -f "$TMP_FILE"
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "FFmpeg exited with code $EXIT_CODE"
            exit $EXIT_CODE
          fi
