name: Restream Pipeline

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        type: choice
        options: [Twitch, YouTube, TikTok, Kick, Facebook]
      action:
        description: 'Action'
        required: true
        type: choice
        options: [start, stop]
      source_url:
        description: 'Source stream/video URL (YouTube, .m3u8, etc.)'
        required: false
        default: ''
      rtmp_url:
        description: 'RTMP URL (auto-filled for TikTok)'
        required: false
        default: ''
      stream_key:
        description: 'Stream key'
        required: false
        default: ''
      title:
        description: 'Stream title'
        required: false
        default: 'Live Stream'
      quality:
        description: 'Video quality preset'
        required: false
        type: choice
        options: [high, medium, low]
        default: 'high'

jobs:
  restream:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'start'
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install dependencies
        run: pip install streamlink yt-dlp

      - name: Resolve source URL
        id: resolve
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
        run: |
          if [ -n "$SOURCE_URL" ]; then
            # Check if it's a direct URL (m3u8, mp4, etc.)
            if echo "$SOURCE_URL" | grep -qE '\.(m3u8|mp4|flv|ts)'; then
              echo "stream_url=$SOURCE_URL" >> $GITHUB_OUTPUT
            else
              # Try to resolve with yt-dlp (more reliable for Twitch)
              STREAM_URL=$(yt-dlp -f "best" -g "$SOURCE_URL" 2>/dev/null || echo "")
              if [ -n "$STREAM_URL" ]; then
                echo "stream_url=$STREAM_URL" >> $GITHUB_OUTPUT
              else
                echo "Error: Could not resolve source URL" >&2
                exit 1
              fi
            fi
          else
            echo "Error: source_url is required" >&2
            exit 1
          fi

      - name: Start restream
        env:
          PLATFORM: ${{ github.event.inputs.platform }}
          RTMP_URL: ${{ github.event.inputs.rtmp_url }}
          STREAM_KEY: ${{ github.event.inputs.stream_key }}
          STREAM_URL: ${{ steps.resolve.outputs.stream_url }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          # Build full RTMP URL
          FULL_RTMP="${RTMP_URL}${STREAM_KEY}"
          
          echo "Starting restream to $PLATFORM"
          echo "Source: $STREAM_URL"
          echo "RTMP: $FULL_RTMP"
          
          # Use ffmpeg directly on HLS URL with robust live stream settings
          ffmpeg -re \
            -analyzeduration 10000000 \
            -probesize 10000000 \
            -fflags +genpts \
            -thread_queue_size 16384 \
            -i "$STREAM_URL" \
            -c:v copy \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv \
            -flvflags no_duration_filesize \
            "$FULL_RTMP"
          
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "FFmpeg exited with code $EXIT_CODE"
            exit $EXIT_CODE
          fi
