name: Restream Pipeline

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        type: choice
        options: [Twitch, YouTube, TikTok, Kick, Facebook]
      action:
        description: 'Action'
        required: true
        type: choice
        options: [start, stop]
      source_url:
        description: 'Source stream/video URL (YouTube, .m3u8, etc.)'
        required: false
        default: ''
      rtmp_url:
        description: 'RTMP URL (auto-filled for TikTok)'
        required: false
        default: ''
      stream_key:
        description: 'Stream key'
        required: false
        default: ''
      title:
        description: 'Stream title'
        required: false
        default: 'Live Stream'
      quality:
        description: 'Video quality preset'
        required: false
        type: choice
        options: [high, medium, low]
        default: 'high'

jobs:
  restream:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'start'
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Setup FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install dependencies
        run: pip install streamlink yt-dlp

      - name: Resolve source URL
        id: resolve
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
        run: |
          if [ -n "$SOURCE_URL" ]; then
            # Check if it's a direct URL (m3u8, mp4, etc.)
            if echo "$SOURCE_URL" | grep -qE '\.(m3u8|mp4|flv|ts)'; then
              echo "stream_url=$SOURCE_URL" >> $GITHUB_OUTPUT
            else
              # Try to resolve with yt-dlp (more reliable for Twitch)
              STREAM_URL=$(yt-dlp -f "best" -g "$SOURCE_URL" 2>/dev/null || echo "")
              if [ -n "$STREAM_URL" ]; then
                echo "stream_url=$STREAM_URL" >> $GITHUB_OUTPUT
              else
                echo "Error: Could not resolve source URL" >&2
                exit 1
              fi
            fi
          else
            echo "Error: source_url is required" >&2
            exit 1
          fi

      - name: Start restream
        env:
          PLATFORM: ${{ github.event.inputs.platform }}
          RTMP_URL: ${{ github.event.inputs.rtmp_url }}
          STREAM_KEY: ${{ github.event.inputs.stream_key }}
          STREAM_URL: ${{ steps.resolve.outputs.stream_url }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          # Build full RTMP URL
          FULL_RTMP="${RTMP_URL}${STREAM_KEY}"
          
          echo "Starting restream to $PLATFORM"
          echo "Source: $STREAM_URL"
          echo "RTMP: $FULL_RTMP"
          
          # Use streamlink with retry loop to handle HLS discontinuities
          TMP_FILE="/tmp/stream_live_$$.ts"
          
          # Function to start streamlink with retries
          start_streamlink() {
            streamlink --output "$TMP_FILE" \
              --hls-live-restart \
              --hls-live-edge 3 \
              --hls-segment-attempts 3 \
              --hls-segment-threads 3 \
              --retry-streams 3 \
              --retry-max 5 \
              --retry-open 3 \
              "$STREAM_URL" best
          }
          
          # Start streamlink in background with retries
          while true; do
            start_streamlink &
            SL_PID=$!
            
            # Wait for file to start being written
            for i in {1..30}; do
              if [ -f "$TMP_FILE" ] && [ -s "$TMP_FILE" ]; then
                break
              fi
              sleep 1
            done
            
            if [ -f "$TMP_FILE" ] && [ -s "$TMP_FILE" ]; then
              break
            fi
            
            echo "Streamlink failed to write, retrying in 5s..."
            kill $SL_PID 2>/dev/null
            wait $SL_PID 2>/dev/null
            rm -f "$TMP_FILE"
            sleep 5
          done
          
          echo "Streamlink writing to $TMP_FILE, starting ffmpeg to stream it..."
          
          # Start ffmpeg streaming the growing file
          # Robust flags for live HLS passthrough
          ffmpeg \
            -err_detect ignore_err \
            -fflags +genpts+discardcorrupt \
            -thread_queue_size 16384 \
            -i "$TMP_FILE" \
            -map 0:v:0 -map 0:a:0 \
            -c:v copy \
            -c:a aac -b:a 128k -ar 44100 \
            -vsync 0 \
            -copyts \
            -f flv \
            -flvflags no_duration_filesize \
            "$FULL_RTMP"
          
          EXIT_CODE=$?
          
          # Cleanup
          kill $SL_PID 2>/dev/null
          wait $SL_PID 2>/dev/null
          rm -f "$TMP_FILE"
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "FFmpeg exited with code $EXIT_CODE"
            exit $EXIT_CODE
          fi
