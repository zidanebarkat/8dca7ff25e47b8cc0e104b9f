name: Restream Pipeline

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        type: choice
        options: [Twitch, YouTube, TikTok, Kick, Facebook]
      action:
        description: 'Action'
        required: true
        type: choice
        options: [start, stop]
      source_url:
        description: 'Source stream/video URL (YouTube, .m3u8, etc.)'
        required: false
        default: ''
      rtmp_url:
        description: 'RTMP URL (auto-filled for TikTok)'
        required: false
        default: ''
      stream_key:
        description: 'Stream key'
        required: false
        default: ''
      title:
        description: 'Stream title'
        required: false
        default: 'Live Stream'
      quality:
        description: 'Video quality preset'
        required: false
        type: choice
        options: [high, medium, low]
        default: 'high'

jobs:
  restream:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'start'
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Setup FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Install dependencies
        run: pip install streamlink yt-dlp

      - name: Resolve source URL
        id: resolve
        env:
          SOURCE_URL: ${{ github.event.inputs.source_url }}
        run: |
          if [ -n "$SOURCE_URL" ]; then
            echo "stream_url=$SOURCE_URL" >> $GITHUB_OUTPUT
          else
            echo "Error: source_url is required" >&2
            exit 1
          fi

      - name: Start restream
        env:
          PLATFORM: ${{ github.event.inputs.platform }}
          RTMP_URL: ${{ github.event.inputs.rtmp_url }}
          STREAM_KEY: ${{ github.event.inputs.stream_key }}
          STREAM_URL: ${{ steps.resolve.outputs.stream_url }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          # Build full RTMP URL
          FULL_RTMP="${RTMP_URL}${STREAM_KEY}"
          
          echo "Starting restream to $PLATFORM"
          echo "Source: $STREAM_URL"
          echo "RTMP: $FULL_RTMP"
          
          # streamlink handles Twitch HLS natively, outputs to temp file
          # ffmpeg reads growing file with -re
          TMP_FILE="/tmp/stream_live_$$.ts"
          
          # Detect protocol from RTMP URL
          if [[ "$RTMP_URL" == srt://* ]]; then
            # SRT protocol (Kick) - URL already contains full params
            OUTPUT_URL="${RTMP_URL}"
            OUTPUT_FORMAT="mpegts"
            EXTRA_FFMPEG_ARGS="-f mpegts"
            AUDIO_CODEC="copy"
          elif [[ "$RTMP_URL" == rtmps://* ]]; then
            # RTMPS protocol
            OUTPUT_URL="${RTMP_URL}${STREAM_KEY}"
            OUTPUT_FORMAT="flv"
            EXTRA_FFMPEG_ARGS="-f flv -flvflags no_duration_filesize"
            AUDIO_CODEC="aac"
          else
            # RTMP protocol (Twitch)
            OUTPUT_URL="${RTMP_URL}${STREAM_KEY}"
            OUTPUT_FORMAT="flv"
            EXTRA_FFMPEG_ARGS="-f flv -flvflags no_duration_filesize"
            AUDIO_CODEC="aac"
          fi
          
          echo "Streaming to: $OUTPUT_URL (format: $OUTPUT_FORMAT)"
          
          # Use streamlink for all (handles YouTube with cookies, Twitch, etc.)
          # streamlink handles YouTube auth/HLS well with cookies
          streamlink \
            --output "$TMP_FILE" \
            --hls-live-restart \
            --hls-live-edge 5 \
            --retry-streams 3 \
            --retry-max 5 \
            --retry-open 3 \
            --http-cookie "$(cat youtube_cookies.txt | grep -v '^#' | awk -F'\t' '{print $6"="$7}' | tr '\n' '; ')" \
            "${{ steps.resolve.outputs.stream_url }}" best &
          DL_PID=$!
          DL_TOOL="streamlink"
          
          # Wait for downloader to start writing data
          for i in {1..30}; do
            if [ -f "$TMP_FILE" ] && [ -s "$TMP_FILE" ]; then
              echo "$DL_TOOL writing to $TMP_FILE, size: $(stat -c%s "$TMP_FILE") bytes"
              break
            fi
            sleep 1
          done
          
          if [ ! -f "$TMP_FILE" ] || [ ! -s "$TMP_FILE" ]; then
            echo "ERROR: $DL_TOOL failed to write to temp file"
            kill $DL_PID 2>/dev/null
            wait $DL_PID 2>/dev/null
            exit 1
          fi
          
          echo "Starting ffmpeg to stream growing file..."
          
          # Start ffmpeg reading growing file WITH -re
          # Use large thread_queue_size and flags to handle growing file
          ffmpeg -re \
            -thread_queue_size 32768 \
            -fflags +genpts+discardcorrupt \
            -err_detect ignore_err \
            -i "$TMP_FILE" \
            -map 0:v:0 -map 0:a:0 \
            -c:v copy \
            -c:a $AUDIO_CODEC \
            -b:a 128k \
            -ar 44100 \
            -fps_mode passthrough \
            $EXTRA_FFMPEG_ARGS \
            "$OUTPUT_URL"
          
          EXIT_CODE=$?
          
          # Cleanup
          kill $DL_PID 2>/dev/null
          wait $DL_PID 2>/dev/null
          rm -f "$TMP_FILE"
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo "FFmpeg exited with code $EXIT_CODE"
            exit $EXIT_CODE
          fi
